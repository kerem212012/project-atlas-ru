{% extends "base.html" %}
{% block title %}{{ project.title }} · ProjectAtlas{% endblock %}
{% block content %}<article class="detail">{% if project.cover_url %}<img src="{{ project.cover_url }}" alt="">{% endif %}<p class="eyebrow">PROJECT</p><h1>{{ project.title }}</h1><p class="description">{{ project.description }}</p>{% if is_owner %}<form action="/projects/{{ project.id }}/delete" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token_value }}"><button class="danger">Delete project</button></form>{% endif %}</article>{% endblock %}
