{% extends "base.html" %}
{% block title %}{{ mode|title }} · ProjectAtlas{% endblock %}
{% block content %}
<section class="panel narrow"><h1>{{ "Create account" if mode == "register" else "Welcome back" }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form action="/{{ mode }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><label>Username<input name="username" minlength="3" maxlength="32" required></label><label>Password<input name="password" type="password" minlength="8" maxlength="128" required></label><button>{{ "Register" if mode == "register" else "Log in" }}</button></form></section>
{% endblock %}
